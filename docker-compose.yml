services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clearing
      POSTGRES_USER: clearing
      POSTGRES_PASSWORD: clearing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearing -d clearing"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: clearing
      DB_USER: clearing
      DB_PASSWORD: clearing
    ports:
      - "8080:8080"

volumes:
  pgdata:
