spring.application.name=intercompany-clearing
server.port=8080

# PostgreSQL keeps netting batches and the original debts.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clearing}
spring.datasource.username=${DB_USER:clearing}
spring.datasource.password=${DB_PASSWORD:clearing}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.jdbc.time_zone=UTC

# Flyway creates the schema and seeds the demo dataset.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# No real bank is ever contacted: payments are simulation only.
clearing.payment.simulated-only=true
