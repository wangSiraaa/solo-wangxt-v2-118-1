# Local/dev profile only — production uses PostgreSQL via the default profile.
# H2 in PostgreSQL mode lets the same Flyway migration + seed run without a server.
spring.datasource.url=jdbc:h2:file:./data/clearing-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
clearing.payment.simulated-only=true
